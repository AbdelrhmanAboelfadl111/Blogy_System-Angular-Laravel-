<div class="itemBox ">
  <div class="box">

    @if (postData().deleted_at != null) {
      <div class="layerDeleted">In Trashed</div>
    }

    <div class="heading">
      <h4 class="titlePost">
        {{postData().title}}
      </h4>
    </div>
    <div class="body">
      <p class="titleBrief">
      {{postData().body}}
      </p>
    </div>
    <div class="span"></div>
    <div class="info">
      <div class="imgCon">
        <h6 class="shortName">
          {{postData().author_name_initials}}
        </h6>
        <div class="date">
          <h6>
            {{postData().author_name}}
          </h6>
          <p>{{postData().formatted_created_at}}</p>
        </div>

      </div>

      @if (false) {
        <div class="operations">

          <a href="" class="btn btn-primary">Edit</a>

          <a href="" class="btn btn-warning">Delete</a>

          <a href="" class="btn btn-primary">Restore</a>

          <a href="" class="btn btn-danger">Force Delete</a>
        </div>
      }


    </div>
  </div>
</div>
